# Stage 3 v6.2 — round 11_2. SI-only retry of round 11.
#
# Round 11 (attempt 1) launched with `w_imbalance = 1.0` and `w_width = 0.2`
# but quickly broke balance instead of fixing it. After 184 steps the
# diagnostic dump showed:
#
#   - `L_imbalance` 0.018 → 0.042  (UP 130%) — balance got WORSE
#   - `L_width`     1.72  → 1.32   (slow improvement)
#   - `L_log_mel`   0.77  → 0.96   (UP 25%) — timbre regressed
#   - `L_stereo_side` flat at ~0.50
#
# Why width broke balance: the width loss `MSE(log SW_pred, log SW_ref)`
# only constrains `P_side / P_mid`. It doesn't care WHICH channel gets
# the extra side energy. With initial L_width ~1.7 (width ratio ~3.7×
# off from ref) and weight 0.2, the SW gradient dominated the new-loss
# term and pushed the model to widen aggressively. The encoder
# widened *asymmetrically* (warm-start gradients route more easily to
# one channel), so SI drifted away from ref balance and timbre took a
# hit while the optimizer spent capacity on width.
#
# Also revealing: at warm-start step 0, `L_imbalance = 0.0014` —
# round-10's best.pt was already approximately balanced per batch on
# average. The "left-pan dominant" pathology was the user's PERCEPTUAL
# read (carried in from the round-9 audition, which used round-9's
# best.pt — a different and more biased model). Round 10's mixes may
# already be much closer to right; we'll find out from the round-11_2
# audition once a ckpt lands.
#
# **Round 11_2 changes (vs the original round 11):**
#   - `w_imbalance = 2.0` (was 1.0). Per-song SI errors are small at
#     warm-start (sqrt(0.0014) ≈ 0.04), so weight 1.0 produced tiny
#     gradient. Bump to 2.0 to get visible movement.
#   - `w_width = 0.0` (was 0.2). DISABLED. The user's complaint was
#     left-pan dominance, not narrowness — width was a "nice-to-have"
#     that turned out to be a "nice-to-not-have." May revisit later
#     with a width target that's coupled to symmetry (e.g., constrain
#     P_L_side ≈ P_R_side independently, not just total |L−R|).
#   - Everything else unchanged: same warm-start (round 10 best.pt),
#     lr 1e-5, alternate-datasets, ema-decay 0.999, val_batches 16,
#     w_stereo_side 2.0, w_loud 0.2, w_log_mel 0.5, w_identity_prior
#     5e-3, w_pan_mean 0.0, 6000 steps, B=4/accum=2, num_workers=3,
#     prefetch_factor=4.

[run]
name = "v6.2-round11_2"
trainer = "diff_console/training/train_stage3.py"

[hardware]
ram_floor_gb = 8
pytorch_cuda_alloc_conf = "expandable_segments:True"

[train]
init_from = "dmc-data/checkpoints/v6.2-round10/mix_encoder_best.pt"
shard_dirs = ["dmc-data/stage3_cambridge_8s", "dmc-data/stage3_slakh_8s"]
alternate_datasets = true
ema_decay = 0.999
n_max = 42
num_workers = 2
val_num_workers = 0
shuffle_buffer = 32
min_track_rms_dbfs = -45.0
steps = 6000
warmup_steps = 200
batch_size = 4
grad_accum_steps = 2
lr = 1e-5
trim_max_db = 18.0
loudness_target_dbfs = -15.0
cuda_memory_fraction = 0.75
ckpt_every = 500
val_every = 250
val_batches = 16
w_loud = 0.2
w_stereo_side = 2.0
w_imbalance = 2.0
w_width = 0.0
w_pan_mean = 0.0
w_identity_prior = 0.005
