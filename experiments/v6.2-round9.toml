# Stage 3 v6.2 — round 9. Stability pass on top of round 8.
#
# Round 8 (v6.2) showed the schema changes work — it reached an excellent basin
# around step 700-800 (L_log_mel ~0.05, L_stereo_side ~0.17, L_pan_mean ~0.0003,
# all far better than round 7) and the eval on its step-1000 ckpt confirmed the
# p2 corner-pinning is fixed (p2_freq lands at varied ~4.3 kHz, p2_gain ~+4 dB).
# BUT it didn't *hold* the basin — it bounced from L_total ~1.0 (step 800) back
# up to ~5.5 (step 1200), a bigger swing than round 7's ~1.8↔3.5. The heavier
# v6.2 loss weights (w_stereo_side 2.5, w_loud 0.3, w_pan_mean 0.2) make the
# loss surface steeper / more multi-objective, so the optimizer ping-pongs
# harder; and lr 2e-5 (which oscillated in round 7 too) is too hot for it.
#
# Round 9 = round 8's working pieces (separated EQ ranges, fixed -15 dBFS trim
# target) + the standard stability levers:
#   - lr 1e-5 (was 2e-5) — half the step size; we've watched 2e-5 oscillate
#     in both rounds 7 and 8.
#   - w_stereo_side 2.0 (was 2.5), w_loud 0.2 (was 0.3), w_pan_mean 0.1 (was
#     0.2) — keep all three on (they fixed real problems: narrow mix, quiet
#     output, L/R lean) but less aggressive, so they don't yank the optimizer
#     around as hard.
#   - val_every 250 (was 500), ckpt_every 500 (was 1000) — so mix_encoder_best.pt
#     actually catches the good phases (round 8's best.pt got stuck at step 500
#     because the step-1000 val landed during a bounce-up).
#
# Warm-start: round 8's step-1000 checkpoint — same v6.2 layout, so the param
# heads transfer cleanly (no re-init needed); it's mid-bounce (L_log_mel ~1.18)
# not garbage, and the lower LR should pull it down to the good basin and hold
# it. (Deviation from the earlier "warm from round 7's best.pt + preserve-head-
# priors" plan: round 8 already paid the fresh-head re-learning cost, and its
# heads are v6.2-native — no reason to throw them away.) NOT --preserve-head-
# priors (load everything).
#   FALLBACK if that ckpt is absent: dmc-data/checkpoints/stage3_v6_round7/mix_encoder_best.pt
#   (which IS the v6.1 layout — then you'd need preserve_head_priors = true; the
#    fallback path in scripts/run.py doesn't handle that, so just fix init_from
#    by hand if it triggers.)
#
# Unchanged: no bypass / no knee / no clip shape-ceiling, w_identity_prior 5e-3,
# activity mask -45, B=4 + grad-accum 2 (effective batch 8), 8s shards, n_max 42,
# shuffle_buffer 32, val_num_workers 0, cuda cap 0.75, RAM watchdog, 6000 steps,
# warmup 200, trim_max_db 18.
#
# Not touched here (deliberately): the hs-band corner-pinning round 8's eval
# surfaced (hs_freq pinned at ~16 kHz, hs_gain ~-12 dB — a steep top roll-off,
# possibly *correct* given band-limited reference mixes, but redundant with the
# LPF). That's a structural question for a later round, not a stability lever.

[run]
name = "v6.2-round9"

[hardware]
ram_floor_gb = 8
pytorch_cuda_alloc_conf = "expandable_segments:True"

[train]
init_from = "dmc-data/checkpoints/v6.2-round8/mix_encoder_step00001000.pt"
shard_dirs = ["dmc-data/stage3_cambridge_8s", "dmc-data/stage3_slakh_8s"]
n_max = 42
num_workers = 2
val_num_workers = 0
shuffle_buffer = 32
min_track_rms_dbfs = -45.0
steps = 6000
warmup_steps = 200
batch_size = 4
grad_accum_steps = 2
lr = 1e-5
trim_max_db = 18.0
loudness_target_dbfs = -15.0
cuda_memory_fraction = 0.75
ckpt_every = 500
val_every = 250
w_loud = 0.2
w_stereo_side = 2.0
w_pan_mean = 0.1
w_identity_prior = 0.005
