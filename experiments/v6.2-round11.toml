# Stage 3 v6.2 — round 11 (DRAFT). L/R-symmetry pass on top of round 10.
#
# Round 11 hasn't been launched yet — this TOML stages the next experiment
# so it's ready to go once round 10 finishes / hits a clear signal.
#
# **Motivation** (carried in from the round-9 audition review and the
# round-10 mid-run inspection): even with the round-10 fixes (alternating
# datasets, EMA, 16-batch val), the model still produces L-leaning mixes.
# This is a *loss-design* gap, not a data or optimization gap:
#
#   - `L_stereo_side` (MSS on (L-R)/2) is magnitude-only — sign-invariant.
#     A left-leaning mix and a right-leaning mix have the same |STFT(side)|
#     and therefore the same loss. The model gets no sign-preserving
#     gradient on the rendered stereo output.
#   - `pan_mean_penalty` is in PARAM space (|mean(pan)| of the pan-knob
#     values across active tracks), not audio. Unweighted by track energy
#     and trivially satisfied by all-tracks-to-center. Weak signal.
#
# Whatever asymmetric prior is in the reference mixes (Cambridge does lean
# left on average — common drummer-perspective convention) becomes
# attractive because moving left is "free" under the current loss.
#
# **Fix — Diff-MST audio-feature loss (Steinmetz 2024):** add two scalar
# audio-domain features computed on the rendered mix, MSE'd against the
# reference. These are exactly the SI/SW features used in the published
# DMC line (arxiv.org/abs/2010.10291 and arxiv.org/html/2407.08889).
#
#   - **--w-imbalance 1.0** (NEW): MSE on SI = (P_R - P_L) / (P_R + P_L).
#     Sign-preserving, scale-invariant, energy-weighted by construction.
#     The principled replacement for --w-pan-mean.
#   - **--w-width 0.2** (NEW): MSE on log(SW) where SW = P_side / P_mid.
#     Scalar width target, complements per-band side MSS. Log-domain so a
#     2× too-narrow miss costs the same as 2× too-wide.
#   - **--w-pan-mean 0** (DISABLED): SI handles the L/R-symmetry job in
#     the audio domain. Param-space pan-mean is redundant + can fight SI.
#   - `--w-stereo-side 2.0` KEPT — still useful for per-band side-energy
#     shape; complementary to the scalar SI/SW (which can't see spectrum).
#
# Unchanged from round 10: lr 1e-5, alternate_datasets, ema_decay 0.999,
# val_batches 16, val_every 250, ckpt_every 500, w_loud 0.2, w_log_mel 0.5,
# w_identity_prior 5e-3, B=4 + grad-accum 2, 8s shards, n_max 42,
# trim_max_db 18, loudness target -15 dBFS, 6000 steps, warmup 200.
#
# Warm-start: round 10's best.pt. (Alternative once round 10 completes:
# warm from `mix_encoder_ema.pt` if it eval's better than best.pt — flip
# init_from below at launch time. EMA is the smoothed center, so it may
# generalize better; best.pt is the validated lowest-recon-loss artifact.)
#
# Loss weights to watch in TB: train/L_imbalance, train/L_width should
# both descend monotonically. Diagnostic: per-song SI of pred vs ref —
# if pred SI distribution centers near ref SI distribution (instead of
# being shifted left), round 11 worked.

[run]
name = "v6.2-round11"

[hardware]
ram_floor_gb = 8
pytorch_cuda_alloc_conf = "expandable_segments:True"

[train]
init_from = "dmc-data/checkpoints/v6.2-round10/mix_encoder_best.pt"
shard_dirs = ["dmc-data/stage3_cambridge_8s", "dmc-data/stage3_slakh_8s"]
alternate_datasets = true
ema_decay = 0.999
n_max = 42
num_workers = 3
prefetch_factor = 4
val_num_workers = 0
shuffle_buffer = 32
min_track_rms_dbfs = -45.0
steps = 6000
warmup_steps = 200
batch_size = 4
grad_accum_steps = 2
lr = 1e-5
trim_max_db = 18.0
loudness_target_dbfs = -15.0
cuda_memory_fraction = 0.75
ckpt_every = 500
val_every = 250
val_batches = 16
w_loud = 0.2
w_stereo_side = 2.0
w_imbalance = 1.0
w_width = 0.2
w_pan_mean = 0.0
w_identity_prior = 0.005
