# Stage 3 v6.2 — round 10. Stability + structural debiasing pass on top of round 9.
#
# Round 9 (still in flight when stopped at step ~2710 / 45%) was a stability
# experiment: lr 1e-5 (half of round 8's 2e-5), lighter loss weights
# (w_stereo 2.0/w_loud 0.2/w_pan 0.1), val/ckpt 2× more often. It worked —
# best.pt actually moved (4–5 new bests by step 2499), the trim/timbre/stereo
# losses are slowly descending. Recent per-step L_total values in the
# 0.35–0.85 range are by far the best the model has reached. BUT a long
# (~150–300 step) oscillation persists, mean ~1.6 with std ~0.6 — slow
# enough that training is taking a long time to converge.
#
# **Cause hypothesis (the user identified it):** Cambridge multitracks and
# Slakh-MIDI-renders sound *very* different — Cambridge is real engineer
# mixes with all the genre variation that implies; Slakh is synthesized from
# MIDI and tonally / dynamically narrower. The current `make_stage3_dataset`
# pools all shards into ONE WebDataset shuffle reservoir; with `shuffle 32`
# and two sources of similar size, the reservoir's Cambridge↔Slakh ratio
# drifts on roughly the timescale of the oscillation. The model is being
# pulled in different directions as the batch composition cycles, which
# *also* makes "best by val" noisy (4-batch val mean varies with the same
# composition drift).
#
# Round 10 changes:
#
#   - **NEW: --alternate-datasets** — build one WebDataset pipeline per
#     `--shard-dirs` entry and round-robin them at the sample level. With 2
#     dirs (Cambridge, Slakh) every batch is exactly 50/50, regardless of
#     shuffle. Defeats the per-batch dataset-mix drift directly. (Code:
#     `_RoundRobinIterableDataset` wraps two `make_stage3_dataset` children.)
#
#   - **NEW: --ema-decay 0.999** — track an exponential moving average of
#     the encoder's float weights, updated each optimizer step. Saved to
#     `mix_encoder_ema.pt` at every --ckpt-every. Half-life ~693 optimizer
#     steps → smooths over several full oscillation cycles. Even if the
#     trained model still bounces, the EMA captures the central value the
#     optimizer is bouncing around — a more reliable inference checkpoint.
#
#   - **--val-batches 16** (was default 4) — a 16-batch val mean has 2× lower
#     std than 4 — so `mix_encoder_best.pt` reflects genuine improvement
#     instead of one lucky 4-batch draw. Cheap (val happens every 250 steps,
#     val_num_workers 0, so ~4× longer per val = adds ~30 s every 250 steps;
#     <2% wall-clock).
#
# Unchanged from round 9: lr 1e-5, w_stereo_side 2.0, w_loud 0.2,
# w_pan_mean 0.1, w_identity_prior 5e-3, B=4 + grad-accum 2 (effective batch
# 8), 8s shards, n_max 42, shuffle 32, val_num_workers 0, cuda cap 0.75,
# RAM watchdog, 6000 steps, warmup 200, trim_max_db 18, loudness target -15.
#
# Warm-start: round 9's step-2500 ckpt — same v6.2 layout, recent training
# state. No --preserve-head-priors (round 9's heads are useful, not toxic).
#
# Not addressed here: the `hs` band corner-pinning from round 8's eval
# (hs_freq ~16 kHz, hs_gain ~-12 dB — a steep top-end roll-off, possibly
# correct given band-limited references but redundant with the LPF). That's
# a schema decision for v6.3, not a stability lever.

[run]
name = "v6.2-round10"

[hardware]
ram_floor_gb = 8
pytorch_cuda_alloc_conf = "expandable_segments:True"

[train]
init_from = "dmc-data/checkpoints/v6.2-round9/mix_encoder_step00002500.pt"
shard_dirs = ["dmc-data/stage3_cambridge_8s", "dmc-data/stage3_slakh_8s"]
alternate_datasets = true
ema_decay = 0.999
n_max = 42
num_workers = 2
val_num_workers = 0
shuffle_buffer = 32
min_track_rms_dbfs = -45.0
steps = 6000
warmup_steps = 200
batch_size = 4
grad_accum_steps = 2
lr = 1e-5
trim_max_db = 18.0
loudness_target_dbfs = -15.0
cuda_memory_fraction = 0.75
ckpt_every = 500
val_every = 250
val_batches = 16
w_loud = 0.2
w_stereo_side = 2.0
w_pan_mean = 0.1
w_identity_prior = 0.005
